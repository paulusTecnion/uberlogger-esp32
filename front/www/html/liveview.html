<div class="card chart-card">
  <div class="chart-toolbar">
    <div id="lv-live-controls" class="toolbar-group">
      <div class="segmented" id="lv-windows" role="group" aria-label="Time window">
        <button type="button" data-ms="60000">1m</button>
        <button type="button" data-ms="300000" class="active">5m</button>
        <button type="button" data-ms="900000">15m</button>
        <button type="button" data-ms="3600000">1h</button>
        <button type="button" data-ms="0" title="All retained history (max ~6 hours)">All</button>
      </div>
      <button type="button" class="button-ghost" id="lv-clear" title="Empty the live history (also clears the saved history)">Clear</button>
      <button type="button" id="lv-follow" class="follow-btn" title="Follow the newest data again (or double-click the chart)">Live</button>
    </div>
    <div id="lv-csv-controls" class="toolbar-group" hidden>
      <button type="button" class="button-ghost" id="lv-back">&larr; Back to live data</button>
      <span id="lv-csv-info" class="muted"></span>
    </div>
    <span id="lv-pin" class="live-state" hidden></span>
    <div class="toolbar-spacer"></div>
    <button type="button" class="button button-secondary button-small button-icon-only" id="lv-export" title="Export chart as PNG" aria-label="Export chart as PNG">
      <!-- "export image": picture (frame, sun, mountains) with a download arrow -->
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="3.5" width="14" height="14" rx="2"/><circle cx="7.5" cy="8.5" r="1.5"/><path d="M2.5 14.5l4-4 4 4 2-2 4 4"/><path d="M20.5 12v9m-3-3l3 3 3-3"/></svg>
    </button>
    <label class="button button-secondary button-small" for="lv-file" title="View a CSV file from your computer (downloaded from the logger)">Open CSV…</label>
    <input type="file" id="lv-file" accept=".csv,text/csv" hidden />
  </div>
  <div id="lv-progress" class="progress" hidden><div></div></div>
  <div id="lv-error" class="error-text"></div>
  <div id="lv-chart"></div>
</div>

<div id="drop-overlay" aria-hidden="true"><div>Drop the CSV file here<small id="drop-overlay-sub">Uberlogger CSV file</small></div></div>
