<div id="log">
  <div class="page-head">
    <h1>Files</h1>
    <span class="sd-summary muted"><span name="SD_CARD_FREE_SPACE">-</span> free</span>
  </div>

  <div class="card" id="filebrowser">
    <div class="files-toolbar">
      <div id="file-path" class="breadcrumb">SD card</div>
      <div class="toolbar-spacer"></div>
      <button id="btn_refresh_sdcard" name="btn_refresh_sdcard" type="button" class="button button-secondary button-small" onclick="filebrowserRefresh(currentFilePath)">&#8635; Refresh</button>
      <button id="btn_unmount_sdcard" name="btn_unmount_sdcard" type="button" class="button button-secondary button-small" onclick="ejectCard()" title="Unmount the SD card so it can be removed safely">&#9167; Unmount</button>
      <button id="btn_format_sdcard" name="btn_format_sdcard" type="button" class="button button-danger button-small" onclick="formatSdcard()" title="Erase all files on the SD card">Format…</button>
    </div>

    <div id="filelist" class="muted">Loading list of files…</div>

    <p class="files-note muted">
      Downloading, deleting and formatting only work while the logger is idle.
      To view a CSV file, download it and open it in <b>Live data → Open CSV…</b>
    </p>
  </div>
</div>
